services:
  gazehum:
    build:
      context: .
      dockerfile: Dockerfile
    image: gazehum:latest
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
      - STREAMLIT_BROWSER_GATHERUSAGESTATS=false
    volumes:
      # Keep secrets outside the image. Streamlit reads this file through
      # st.secrets, so the app keeps the same import/runtime path.
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
      # Persist student photos, enrollment uploads, and any future runtime data.
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
